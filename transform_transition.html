<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .b_container{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-left: 20px;
        padding-top: 100;
    }
    .s_box{
        background-color: pink;
        color: white;
        border-radius: 10px;
        height: 250px;
        width: 250px;
        font-size: 20px;
        padding: 20px;
        margin: 20px;
        border: 5px solid deeppink;
        transition: transform 10s ease-in;
    }
    .b1:hover{
        transform: translate(125px, 125px);
    }
    .b2:hover{
        transform: translateX(200px);
    }
    .b3:hover{
        transform: translateY(200px);
    }
    .b4:hover{
        transform: rotate(720deg);
        background-color: chocolate;
    }
    .b5:hover{
        transform: skewY(50deg);
    }
    .b6:hover{
        transform: scale(1.5);
    }
    </style>
<body>
    <!-- div.b_container>div.s_box*6 -->
    <div class="b_container">
        <div class="s_box b1">translate</div>
        <div class="s_box b2">translateX</div>
        <div class="s_box b3">translateY</div>
        <div class="s_box b4">rotate</div>
        <div class="s_box b5">skew</div>
        <div class="s_box b6">scale</div>
    </div>
</body>
</html>
